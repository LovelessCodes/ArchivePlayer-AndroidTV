name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "versionName = \"${version}\"" app/build.gradle.kts; then
            echo "Tag ${GITHUB_REF_NAME} does not match app/build.gradle.kts versionName." >&2
            exit 1
          fi

      - name: Restore optional release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/release/ArchivePlayerTV-${version}.apk"
          cd "$RUNNER_TEMP/release"
          sha256sum "ArchivePlayerTV-${version}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "Native Android TV client for ArchivePlayer."
            echo
            echo "### What's in this build"
            echo
            echo "- LAN discovery for ArchivePlayer servers advertising \`_archiveplayer._tcp\`"
            echo "- QR and short-code device pairing; no account credential on the TV"
            echo "- Continue watching, category rows, title details, and episodes"
            echo "- Media3/ExoPlayer playback with D-pad controls and progress sync"
            echo "- Android Keystore token storage and LAN-first remote fallback"
            echo
            echo "Requires ArchivePlayer server v0.5.0 or newer (API version \`1\`)."
            echo
            echo "### Install"
            echo
            echo "\`adb connect <tv-ip>:5555\` then \`adb install -r ArchivePlayerTV-${version}.apk\`."
            echo "Enable Network debugging in the TV developer options first."
            echo
            if [ -n "$KEYSTORE_FILE" ]; then
              echo "This APK is signed with the configured release keystore."
            else
              echo "**Preview signing:** this APK uses the Android debug key. It is installable, but a future build with a different key requires uninstalling the old app. Do not use this signature for store distribution."
            fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: archiveplayer-tv-release
          path: |
            ${{ runner.temp }}/release/ArchivePlayerTV-*.apk
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ArchivePlayer TV ${{ github.ref_name }}
          generate_release_notes: true
          body_path: ${{ runner.temp }}/notes.md
          files: |
            ${{ runner.temp }}/release/ArchivePlayerTV-*.apk
            ${{ runner.temp }}/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
